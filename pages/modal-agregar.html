<div id="miModal" class="modal">
    <div class="modal-contenido">
        <span class="cerrar" id="cerrarModal">&times;</span>
        <h2>Formulario Modal</h2>
        <form class="modal-form">
            <label for="nombre-modal">Nombre:</label>
            <input type="text" id="nombre-modal" name="nombre-modal" required>
            <label for="email-modal">Correo electrónico:</label>
            <input type="email" id="email-modal" name="email-modal" required>
            <button type="submit">Enviar</button>
        </form>
    </div>
</div>
