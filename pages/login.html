<div class="login">
    <div class="login-container">
        <h2>Iniciar Sesión</h2>
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Usuario</label>
                <input type="text" id="username" name="username" required minlength="4" maxlength="20">
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password">
            </div>
            <button type="button" class="btn" onclick="cargarPagina('dashboard')">Ingresar</button>
            <div class="error-message" id="errorMessage"></div>
        </form>
        <div class="separator">o</div>
        <button class="btn google-btn" onclick="cargarPagina('dashboard')">Ingresar con Google</button>
    </div>
</div>
