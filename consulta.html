<!DOCTYPE html>
<html lang="es" xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Registrar</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/base/reset.css">
    <link rel="stylesheet" href="assets/css/base/base.css">
    <link rel="stylesheet" href="assets/css/consulta.css">

</head>
<body>
<div class="wrapper">
    <!-- Menu-->
    <aside class="sidebar">
        <nav>
            <div class="menu-title">Menú</div>
            <a href="dashboard.html" class="nav-item">
                <i class="fa-solid fa-house icon"></i>
                <span class="label">Inicio</span>
            </a>
            <a href="registrar.html" class="nav-item">
                <i class="fa-solid fa-bug icon"></i>
                <span class="label">Registrar</span>
            </a>
            <a href="#" class="nav-item">
                <i class="fa-solid fa-magnifying-glass icon"></i>
                <span class="label">Consultar</span>
            </a>
            <a href="#" class="nav-item">
                <i class="fa-solid fa-gears icon"></i>
                <span class="label">Configuración</span>
            </a>
        </nav>
    </aside>

    <div class="content-area">
        <header class="header">
            <div class="container-header">
                <h1 class="logo">SITEC</h1>
                <div class="header-right">
                    <input id="search" type="text" placeholder="Buscar..."/>
                    <div class="menu-wrapper">
                        <i class="fa-solid fa-bars menu-icon"></i>
                        <div class="dropdown-menu" id="dropdown">
                            <a href="a">Cerrar sesión</a>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <main class="main-content">
            <div class="filters">
                <div class="filter">
                    <label for="estado">Estado</label>
                    <select id="estado">
                        <option value="">Todos</option>
                        <option>Abierto</option>
                        <option>Cerrado</option>
                        <option>Espera</option>
                    </select>
                </div>

                <div class="filter">
                    <label for="desde">Desde</label>
                    <input type="date" id="desde"/>
                </div>

                <div class="filter">
                    <label for="hasta">Hasta</label>
                    <input type="date" id="hasta"/>
                </div>

                <div class="filter">
                    <label for="buscar-id">Buscar por ID</label>
                    <input type="text" id="buscar-id" placeholder="Ingrese ID..."/>
                </div>
            </div>

            <div class="tabla-container">
                <table>
                    <thead class="tabla-encabezado">
                    <tr>
                        <th>ID</th>
                        <th>Solicitante</th>
                        <th>Fecha</th>
                        <th>Prioridad</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr>
                        <td>00123</td>
                        <td>Juan Pérez</td>
                        <td>2025-05-18</td>
                        <td>Alta</td>
                        <td>Cerrado</td>
                        <td class="actions">
                            <div class="actions-container">
                                <button class="details">Detalles</button>
                                <button class="attend">Atender</button>
                                <button class="print">Imprimir</button>
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <td>00124</td>
                        <td>Ana Gómez</td>
                        <td>2025-05-19</td>
                        <td>Media</td>
                        <td>Cerrado</td>
                        <td class="actions">
                            <div class="actions-container">
                                <button class="details">Detalles</button>
                                <button class="attend">Atender</button>
                                <button class="print">Imprimir</button>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </main>

        <footer>
            <p>&copy; 2025 Sistema de Incidencias Tecnológicas | Todos los derechos reservados</p>
        </footer>
    </div>
